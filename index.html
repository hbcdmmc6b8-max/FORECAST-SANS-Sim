<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./forecast-spritesheet.png">
<title>FORECAST!SANS — Same End Anyway</title>
<link rel="stylesheet" href="./css/game.css">
</head>
<body>
<div id="mainMenu" class="menu-screen">
  <div class="menu-noise"></div>
  <div class="menu-content">
    <div class="menu-kicker">THE FUTURE HAS ALREADY BEEN SEEN</div>
    <h1>FORECAST!<span>SANS</span></h1>
    <div class="menu-subtitle">SAME END ANYWAY.</div>
    <div class="menu-character" aria-hidden="true"></div>
    <div class="menu-select">SELECT</div>
    <div class="menu-actions">
      <button id="menuStart" class="menu-primary" type="button"><span class="menu-cursor">▶</span><span>NEW GAME</span></button>
      <button id="menuContinue" type="button"><span class="menu-cursor">▶</span><span>CONTINUE</span></button>
      <button id="menuSettings" type="button"><span class="menu-cursor">▶</span><span>SETTINGS</span></button>
    </div>
    <div id="menuSettingsPanel" class="menu-settings" hidden>
      <label><span>SOUND</span><input id="menuSound" type="checkbox" checked></label>
      <label><span>SCREEN SHAKE</span><input id="menuShake" type="checkbox" checked></label>
      <button id="menuSettingsBack" type="button">BACK</button>
    </div>
    <div class="menu-footer"><span>↑↓ SELECT</span><span>ENTER CONFIRM</span></div>
  </div>
</div>
<div id="game" class="game-hidden">
<header id="hud">
<div><small>FORECAST!SANS</small><strong id="phaseLabel">PHASE 1</strong></div>
<div id="phaseTrack"></div>
<div class="enemy"><small>PROTAGONIST</small><div class="bar"><i id="enemyHealthFill"></i></div><small id="enemyHealthText">100 / 100</small></div>
</header>
<div id="turnBanner">FORECAST TURN</div>
<main id="battleArea"><canvas id="gameCanvas"></canvas><div id="phaseSplash"></div><div id="aimHint">DRAG TO AIM • RELEASE TO ATTACK</div></main>
<section id="staminaHUD"><div class="meter"><span>STAMINA</span><span id="staminaText">100 / 100</span></div><div class="bar stamina"><i id="staminaFill"></i></div></section>
<section id="dialogue" aria-live="polite"><div id="speaker">FORECAST</div><div class="dialogue-row"><span>*</span><span id="dialogueText">...</span></div><div id="dialogueContinue">TAP TO CONTINUE</div></section>
<section id="arsenal">
<div class="arsenal-head"><button id="arsenalToggle" type="button"><span>ARSENAL</span><span id="arsenalToggleIcon">−</span></button><button id="installAppButton" type="button" hidden>INSTALL APP</button></div>
<div id="arsenalBody">
<nav id="categoryNav">
<button class="category-button active" data-category="WEAPON">WEAPON</button>
<button class="category-button" data-category="EYES">EYES</button>
<button class="category-button" data-category="TECHNIQUE">TECHNIQUE</button>
<button class="category-button" data-category="FORECAST">FORECAST</button>
<button class="category-button owner-tab" data-category="OWNER" hidden>OWNER</button>
</nav>
<div id="abilityPanel"></div>
<div id="ownerUnlock"><button id="ownerUnlockButton" type="button">OWNER ACCESS</button><div id="ownerCodePanel" hidden><input id="ownerCodeInput" inputmode="numeric" maxlength="4" placeholder="CODE" aria-label="Owner code"><button id="ownerCodeSubmit" type="button">UNLOCK</button></div></div>
</div>
</section>
<pre id="errorBox"></pre>
</div>
<script src="./js/phases.js"></script>
<script src="./js/weapons.js"></script>
<script src="./js/eyes.js"></script>
<script src="./js/techniques.js"></script>
<script src="./js/dialogue.js"></script>
<script src="./js/battle.js"></script>
<script src="./js/game.js"></script>
<script src="./js/offline.js"></script>
</body>
</html>
