<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    >

    <meta name="theme-color" content="#050505">

    <title>
        FORECAST!SANS — Same End Anyway
    </title>

    <link
        rel="stylesheet"
        href="./css/game.css"
    >

</head>


<body>

<main id="game">


    <!-- =====================================
         BATTLEFIELD
    ====================================== -->

    <canvas id="gameCanvas"></canvas>



    <!-- =====================================
         TOP HUD
    ====================================== -->

    <header id="hud">


        <!-- FORECAST -->

        <section id="forecastHUD">

            <div class="hud-name">
                FORECAST!SANS
            </div>

            <div id="phaseLabel">
                PHASE 1
            </div>


            <div id="phaseTrack">

                <span class="phase-node active">
                    1
                </span>

                <span class="phase-node">
                    1.5
                </span>

                <span class="phase-node">
                    2
                </span>

                <span class="phase-node">
                    2.5
                </span>

                <span class="phase-node">
                    3
                </span>

                <span class="phase-node">
                    3.5
                </span>

                <span class="phase-node">
                    4
                </span>

                <span class="phase-node">
                    4.5
                </span>

                <span class="phase-node">
                    5
                </span>

            </div>

        </section>



        <!-- PROTAGONIST -->

        <section id="enemyHUD">

            <div class="hud-name">
                PROTAGONIST
            </div>


            <div id="enemyHPBar">

                <div id="enemyHPFill"></div>

            </div>


            <div id="enemyHPText">
                100 / 100
            </div>

        </section>


    </header>



    <!-- =====================================
         TURN
    ====================================== -->

    <div id="turnBanner">
        FORECAST TURN
    </div>



    <!-- =====================================
         PHASE CHANGE
    ====================================== -->

    <section id="phaseSplash">

        <div id="phaseSplashTop">
            HIT CONFIRMED
        </div>

        <div id="phaseSplashMain">
            PHASE 1.5
        </div>

    </section>



    <!-- =====================================
         STAMINA
    ====================================== -->

    <section id="staminaHUD">

        <div id="staminaHeader">

            <span>
                STAMINA
            </span>

            <span id="staminaText">
                100 / 100
            </span>

        </div>


        <div id="staminaBar">

            <div id="staminaFill"></div>

        </div>


        <div id="dodgeStatus">
            AUTO-DODGE READY
        </div>

    </section>



    <!-- =====================================
         DIALOGUE
    ====================================== -->

    <section id="dialogueBox">

        <span id="dialogueStar">
            *
        </span>

        <span id="dialogueText">
            Another possibility enters your sight.
        </span>

    </section>



    <!-- =====================================
         ABILITY SELECTOR
    ====================================== -->

    <section id="abilityPanel">

        <div id="abilityHeader">
            ARSENAL
        </div>

        <div id="abilityList"></div>

    </section>



    <!-- =====================================
         MAIN CATEGORIES
    ====================================== -->

    <nav id="categoryMenu">


        <button
            class="category-button active"
            data-category="weapon"
        >
            WEAPON
        </button>


        <button
            class="category-button"
            data-category="eyes"
        >
            EYES
        </button>


        <button
            class="category-button"
            data-category="technique"
        >
            TECHNIQUE
        </button>


        <button
            class="category-button"
            data-category="forecast"
        >
            FORECAST
        </button>


    </nav>



    <!-- =====================================
         ACTION
    ====================================== -->

    <section id="controls">


        <div id="combatStatus">

            <div id="combatStatusTitle">
                COMBAT MODE
            </div>

            <div id="combatStatusText">
                ATTACK
            </div>

        </div>



        <div id="actionArea">

            <div id="selectedDisplay">
                GLOCK
            </div>


            <button id="actionButton">
                ATTACK
            </button>

        </div>


    </section>



    <!-- =====================================
         ERROR DISPLAY
    ====================================== -->

    <pre id="errorBox"></pre>


</main>



<!-- =========================================
     GAME MODULES

     LOAD ORDER MATTERS.
========================================== -->

<script src="./js/phases.js"></script>

<script src="./js/weapons.js"></script>

<script src="./js/eyes.js"></script>

<script src="./js/techniques.js"></script>

<script src="./js/battle.js"></script>

<script src="./js/game.js"></script>



<!-- =========================================
     MOBILE ERROR REPORTER
========================================== -->

<script>

    window.addEventListener(
        "error",
        function (event) {

            const box =
                document.getElementById(
                    "errorBox"
                );


            if (!box) {
                return;
            }


            box.style.display =
                "block";


            box.textContent =
                "GAME ERROR\n\n" +

                event.message +

                "\n\n" +

                (
                    event.filename ||
                    ""
                ) +

                ":" +

                (
                    event.lineno ||
                    ""
                );
        }
    );

</script>


</body>

</html>
