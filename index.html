<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    >

    <meta name="theme-color" content="#050505">

    <title>FORECAST!SANS — Same End Anyway</title>

    <link rel="stylesheet" href="./css/game.css">
</head>

<body>

<main id="game">

    <!-- ACTUAL BATTLE -->
    <canvas id="gameCanvas"></canvas>


    <!-- TOP HUD -->
    <header id="hud">

        <section id="forecastHUD">

            <div class="hud-name">
                FORECAST!SANS
            </div>

            <div id="phaseLabel">
                PHASE 1
            </div>

            <div id="phaseTrack">

                <span class="phase-node active">1</span>
                <span class="phase-node">1.5</span>
                <span class="phase-node">2</span>
                <span class="phase-node">2.5</span>
                <span class="phase-node">3</span>
                <span class="phase-node">3.5</span>
                <span class="phase-node">4</span>
                <span class="phase-node">4.5</span>
                <span class="phase-node">5</span>

            </div>

        </section>


        <section id="enemyHUD">

            <div class="hud-name">
                PROTAGONIST
            </div>

            <div id="enemyHPBar">
                <div id="enemyHPFill"></div>
            </div>

            <div id="enemyHPText">
                100 / 100
            </div>

        </section>

    </header>


    <!-- TURN DISPLAY -->
    <div id="turnBanner">
        FORECAST TURN
    </div>


    <!-- PHASE CHANGE -->
    <section id="phaseSplash">

        <div id="phaseSplashTop">
            HIT CONFIRMED
        </div>

        <div id="phaseSplashMain">
            PHASE 1.5
        </div>

    </section>


    <!-- DIALOGUE -->
    <section id="dialogueBox">

        <span id="dialogueStar">*</span>

        <span id="dialogueText">
            Another possibility enters your sight.
        </span>

    </section>


    <!-- ABILITY SELECTOR -->
    <section id="abilityPanel">

        <div id="abilityHeader">
            ARSENAL
        </div>

        <div id="abilityList"></div>

    </section>


    <!-- FOUR MAIN CATEGORIES -->
    <nav id="categoryMenu">

        <button
            class="category-button active"
            data-category="weapon"
        >
            WEAPON
        </button>

        <button
            class="category-button"
            data-category="eyes"
        >
            EYES
        </button>

        <button
            class="category-button"
            data-category="technique"
        >
            TECHNIQUE
        </button>

        <button
            class="category-button"
            data-category="forecast"
        >
            FORECAST
        </button>

    </nav>


    <!-- MOBILE CONTROLS -->
    <section id="controls">

        <div id="dpad">

            <button
                id="upButton"
                class="move-button"
                aria-label="Move up"
            >
                ▲
            </button>

            <button
                id="leftButton"
                class="move-button"
                aria-label="Move left"
            >
                ◀
            </button>

            <button
                id="downButton"
                class="move-button"
                aria-label="Move down"
            >
                ▼
            </button>

            <button
                id="rightButton"
                class="move-button"
                aria-label="Move right"
            >
                ▶
            </button>

        </div>


        <div id="actionArea">

            <div id="selectedDisplay">
                GLOCK
            </div>

            <button id="actionButton">
                ATTACK
            </button>

        </div>

    </section>


    <!-- DEVELOPMENT ERROR BOX

         If one of our JS files breaks,
         we'll display the error here instead
         of getting another mysterious blank page.
    -->
    <pre id="errorBox"></pre>

</main>


<!--
    IMPORTANT:
    These paths now EXACTLY match the repo:
    /js/file.js
-->

<script src="./js/phases.js"></script>
<script src="./js/weapons.js"></script>
<script src="./js/eyes.js"></script>
<script src="./js/techniques.js"></script>
<script src="./js/battle.js"></script>
<script src="./js/game.js"></script>


<!-- Show JS errors directly on iPhone -->
<script>
    window.addEventListener("error", function (event) {
        const box = document.getElementById("errorBox");

        if (!box) return;

        box.style.display = "block";

        box.textContent =
            "GAME ERROR\n\n" +
            event.message +
            "\n\n" +
            (event.filename || "") +
            ":" +
            (event.lineno || "");
    });
</script>

</body>
</html>
