<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#000000">

    <title>FORECAST!SANS — Same End Anyway</title>

    <link rel="stylesheet" href="./css/game.css">
</head>

<body>

<div id="game">

    <!-- MAIN GAME CANVAS -->
    <canvas id="gameCanvas"></canvas>


    <!-- =========================
         TOP HUD
    ========================== -->

    <header id="hud">

        <section class="hud-side boss-hud">

            <div class="hud-name">
                FORECAST!SANS
            </div>

            <div id="phaseLabel">
                PHASE 1
            </div>

            <div id="phaseTrack">

                <span class="phase-node active">1</span>
                <span class="phase-node">1.5</span>
                <span class="phase-node">2</span>
                <span class="phase-node">2.5</span>
                <span class="phase-node">3</span>
                <span class="phase-node">3.5</span>
                <span class="phase-node">4</span>
                <span class="phase-node">4.5</span>
                <span class="phase-node">5</span>

            </div>

        </section>


        <section class="hud-side enemy-hud">

            <div id="enemyName" class="hud-name">
                UNKNOWN
            </div>

            <div class="hp-shell">
                <div id="enemyHP"></div>
            </div>

            <div id="enemyStatus">
                DETERMINATION
            </div>

        </section>

    </header>


    <!-- =========================
         PHASE TRANSITION
    ========================== -->

    <div id="phaseTransition">

        <div id="phaseTransitionSmall">
            HIT CONFIRMED
        </div>

        <div id="phaseTransitionBig">
            PHASE 1.5
        </div>

    </div>


    <!-- =========================
         DIALOGUE
    ========================== -->

    <section id="dialogueBox">

        <span id="dialogueStar">*</span>

        <span id="dialogueText">
            Another possibility enters your sight.
        </span>

    </section>


    <!-- =========================
         SUB MENU
    ========================== -->

    <section id="abilityPanel">

        <div id="abilityTitle">
            ARSENAL
        </div>

        <div id="abilityOptions">
            <!-- JavaScript generates buttons here -->
        </div>

    </section>


    <!-- =========================
         MAIN MENU
    ========================== -->

    <nav id="battleMenu">

        <button
            class="menu-button active"
            data-menu="weapon"
        >
            WEAPON
        </button>

        <button
            class="menu-button"
            data-menu="eyes"
        >
            EYES
        </button>

        <button
            class="menu-button"
            data-menu="technique"
        >
            TECHNIQUE
        </button>

        <button
            class="menu-button"
            data-menu="forecast"
        >
            FORECAST
        </button>

    </nav>


    <!-- =========================
         MOBILE MOVEMENT
    ========================== -->

    <section id="mobileControls">

        <div id="dpad">

            <button
                class="move-button"
                id="moveUp"
                aria-label="Move up"
            >
                ▲
            </button>

            <button
                class="move-button"
                id="moveLeft"
                aria-label="Move left"
            >
                ◀
            </button>

            <button
                class="move-button"
                id="moveDown"
                aria-label="Move down"
            >
                ▼
            </button>

            <button
                class="move-button"
                id="moveRight"
                aria-label="Move right"
            >
                ▶
            </button>

        </div>


        <button id="attackButton">
            ATTACK
        </button>

    </section>


    <!-- =========================
         DEBUG / STATE DISPLAY
    ========================== -->

    <aside id="battleState">

        <span id="turnText">
            YOUR TURN
        </span>

        <span class="separator">
            /
        </span>

        <span id="selectedAbility">
            GLOCK
        </span>

    </aside>

</div>


<!-- =============================
     GAME MODULES

     Order matters.
============================== -->

<script src="./js/phases.js"></script>
<script src="./js/weapons.js"></script>
<script src="./js/eyes.js"></script>
<script src="./js/techniques.js"></script>
<script src="./js/battle.js"></script>
<script src="./js/game.js"></script>

</body>
</html>
